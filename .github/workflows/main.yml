name: GitHub build test
run-name: is testing out GitHub Actions 🚀
on:
  push:
    tags:        
      - '*'          
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: run
        run: |
          echo $RELEASE_VERSION
          echo ${{ env.RELEASE_VERSION }}
